name: Explosion visual check

on:
  push:
    branches: [main]
    paths:
      - 'effects/explosion/**'
      - 'tools/explosion_visual_check.gd'
      - '.github/workflows/explosion-visual-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install Godot 4.7.2
        run: |
          archive="Godot_v4.7.2-stable_linux.x86_64.zip"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$archive" \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/$archive"
          echo "9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65  $RUNNER_TEMP/$archive" | sha512sum --check --strict
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Install virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Import resources
        run: godot --headless --audio-driver Dummy --editor --path . --quit
      - name: Render explosion scenes
        run: |
          mkdir -p "$RUNNER_TEMP/explosion-review"
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s '-screen 0 1600x900x24' \
            godot --audio-driver Dummy --rendering-driver opengl3 --fixed-fps 60 --resolution 960x540 --path . \
            --script res://tools/explosion_visual_check.gd -- \
            "--out=$RUNNER_TEMP/explosion-review" | tee "$RUNNER_TEMP/explosion-review.log"
          grep -q EXPLOSION_VISUAL_CHECK_OK "$RUNNER_TEMP/explosion-review.log"
      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explosion-review
          path: |
            ${{ runner.temp }}/explosion-review/*.png
            ${{ runner.temp }}/explosion-review.log
          if-no-files-found: warn
